  :root {

    --muted: #8B8BA0;

  html { scroll-behavior: smooth; }
  body {
    background-color: var(--bg);
    background-image:

      radial-gradient(50rem 28rem at -10% 0%, rgba(0, 240, 255, .10), transparent 60%);

    background: linear-gradient(135deg, var(--pink), var(--cyan));

  .btn-nav:hover, .switch:hover { border-color: rgba(255, 46, 147, .5); }
  .switch { gap: .6rem; }
  .switch .track { position: relative; width: 2.25rem; height: 1.25rem; border-radius: 999px; background: #2b2b3a; transition: background .2s; flex: none; }
  .switch .thumb { position: absolute; top: .15rem; left: .15rem; width: .95rem; height: .95rem; border-radius: 999px; background: #fff; transition: transform .2s; }
  .switch[aria-checked="true"] .track { background: var(--pink); box-shadow: 0 0 12px rgba(255, 46, 147, .6); }
  .switch[aria-checked="true"] .thumb { transform: translateX(1rem); }

  /* Champs */
  .field { background: var(--card); border: 1px solid var(--line); border-radius: .75rem; color: #ECECF3;
    height: 2.5rem; font-size: .875rem; transition: border-color .15s, box-shadow .15s; }
  .field:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0, 240, 255, .15); }
  select.field { color-scheme: dark; padding: 0 2rem 0 .75rem; appearance: none; -webkit-appearance: none; cursor: pointer; }
  select.lang-select { color-scheme: dark; appearance: none; -webkit-appearance: none; cursor: pointer; }
  select.lang-select:focus { outline: none; border-color: var(--cyan); }

  /* Cartes */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 1rem;
    transition: transform .18s, border-color .18s, box-shadow .18s;
    cursor: pointer; position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
    background: linear-gradient(90deg, var(--pink), var(--cyan)); opacity: .0; transition: opacity .2s;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-3px); border-color: rgba(255, 46, 147, .6);
    box-shadow: 0 0 0 1px rgba(255, 46, 147, .25), 0 14px 34px -14px rgba(255, 46, 147, .5);
    outline: none;
  }
  .card:hover::before, .card:focus-visible::before { opacity: 1; }
  .card.flash { animation: flash 1.1s ease-out; }
  @keyframes flash {
    0% { box-shadow: 0 0 0 2px var(--cyan), 0 0 28px rgba(0, 240, 255, .55); }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  /* Pastilles */
  .chip { display: inline-flex; align-items: center; font-size: .6875rem; font-weight: 700; letter-spacing: .08em;
    padding: .2rem .55rem; border-radius: .5rem; border: 1px solid var(--line); color: #B9B9CB; background: rgba(255, 255, 255, .03); }
  .tag { display: inline-flex; align-items: center; font-size: .6875rem; font-weight: 700; letter-spacing: .06em;

  .tag-lucia { color: var(--pink); border-color: rgba(255, 46, 147, .45); background: rgba(255, 46, 147, .1); }
  .tag-jason { color: var(--cyan); border-color: rgba(0, 240, 255, .45); background: rgba(0, 240, 255, .08); }
  .tag-duo { color: #C9AEFF; border-color: rgba(201, 174, 255, .45); background: rgba(160, 110, 255, .1); }

  /* Étoiles */
  .stars { position: relative; display: inline-block; line-height: 1; white-space: nowrap; letter-spacing: .05em; vertical-align: middle; }
  .stars .bg { color: #2C2C3C; }
  .stars .fg { position: absolute; left: 0; top: 0; overflow: hidden; white-space: nowrap; height: 100%;
    color: var(--cyan); text-shadow: 0 0 10px rgba(0, 240, 255, .5); }
  .stars.mine .fg { color: var(--pink); text-shadow: 0 0 12px rgba(255, 46, 147, .6); }

  /* Anti-spoiler */
  .spoiler { filter: blur(7px); user-select: none; -webkit-user-select: none; transition: filter .2s; }

  /* Séparateur */
  .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  /* Modale */
  #modal { position: fixed; inset: 0; z-index: 60; display: none; align-items: flex-end; justify-content: center;

  #modal.open { display: flex; animation: fade .18s ease-out; }
  @media (min-width: 640px) { #modal { align-items: center; padding: 1.5rem; } }
  .panel { width: 100%; max-width: 34rem; max-height: 92vh; overflow-y: auto; background: var(--card);
    border: 1px solid rgba(255, 46, 147, .35); border-radius: 1.25rem 1.25rem 0 0;
    box-shadow: 0 0 0 1px rgba(0, 240, 255, .08), 0 30px 80px -20px rgba(255, 46, 147, .4);
    animation: rise .22s ease-out; }
  @media (min-width: 640px) { .panel { border-radius: 1.25rem; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }

  .rater { position: relative; display: inline-block; font-size: 2.75rem; line-height: 1; cursor: pointer;
    touch-action: manipulation; border-radius: .5rem; letter-spacing: .05em; white-space: nowrap; }
  .rater:focus-visible { outline: 2px solid var(--cyan); outline-offset: 6px; }
  .rater .bg { color: #2C2C3C; }
  .rater .fg { position: absolute; left: 0; top: 0; height: 100%; overflow: hidden; white-space: nowrap;
    color: var(--pink); text-shadow: 0 0 16px rgba(255, 46, 147, .65); }
  .rater.pop { animation: pop .3s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }

  .box { background: rgba(255, 255, 255, .03); border: 1px solid var(--line); border-radius: .875rem; padding: .85rem 1rem; }

  #toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;

const DEMO_MODE = !SUPABASE_URL || !SUPABASE_ANON_KEY;
const $ = (sel, root = document) => root.querySelector(sel);

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
function readJSON(key, fallback) {
  try { const v = JSON.parse(store.get(key)); return v == null ? fallback : v; } catch (e) { return fallback; }
}

const K_VISITOR = 'rate6_visitor_id';
const K_SPOILER = 'rate6_antispoiler';
const K_REVEALED = 'rate6_revealed';

const K_TRANS_CACHE = 'rate6_trans_v1';

function genId() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  return 'v-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
}

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const pad2 = (n) => String(n).padStart(2, '0');
const tagKey = (p) => ({ Lucia: 'lucia', Jason: 'jason', Duo: 'duo' }[p] || 'duo');

function hash(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

   ÉTAT & LANGUE

let visitorId = store.get(K_VISITOR);
if (!visitorId) { visitorId = genId(); store.set(K_VISITOR, visitorId); }

function detectUserLang() {
  const saved = store.get(K_LANG);
  if (saved && SUPPORTED_LANGS.includes(saved)) return saved;

  const browserLangs = Array.isArray(navigator.languages) && navigator.languages.length
    ? navigator.languages
    : [navigator.language || 'en'];

  for (const raw of browserLangs) {
    if (!raw) continue;
    const code = String(raw).toLowerCase().split('-')[0];
    if (SUPPORTED_LANGS.includes(code)) return code;
  }
  return 'en';
}

  lang: detectUserLang(),
  statusKind: 'connecting',

  chapter: 'all',
  antiSpoiler: store.get(K_SPOILER) !== '0',

  currentId: null,
  lastFocusId: null
};

const fmt1 = (n) => Number(n).toLocaleString(LOCALES[state.lang] || 'en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });

/* ==========================================================================
   TRADUCTION DYNAMIQUE DES CHAPITRES, TITRES & DESCRIPTIONS
   ========================================================================== */
const transCache = readJSON(K_TRANS_CACHE, {}) || {};
const inFlightLangs = new Set();

function getChapterTitle(ch) {
  const orig = CHAPTERS[ch] || '';
  if (state.lang === 'fr') return orig;
  const entry = transCache[state.lang];
  return (entry && entry.chapters && entry.chapters[ch]) || orig;
}

function getMissionTitle(m) {
  if (state.lang === 'fr') return m.title;
  const entry = transCache[state.lang];
  return (entry && entry.titles && entry.titles[m.id]) || m.title;
}

function getMissionDesc(m) {
  if (state.lang === 'fr') return m.description;
  const entry = transCache[state.lang];
  return (entry && entry.descs && entry.descs[m.id]) || m.description;
}

async function translateBatch(texts, targetLang) {
  const tl = TRANSLATE_CODES[targetLang] || targetLang;
  const joined = texts.join('\n');
  const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=fr&tl=${encodeURIComponent(tl)}&dt=t&q=${encodeURIComponent(joined)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  const full = (data[0] || []).map((part) => part[0] || '').join('');
  const lines = full.split('\n');
  return texts.map((orig, idx) => (lines[idx] && lines[idx].trim()) ? lines[idx].trim() : orig);
}

async function ensureContentTranslated(lang) {
  if (lang === 'fr') return;
  const existing = transCache[lang];
  if (existing && existing.complete) return;
  if (inFlightLangs.has(lang)) return;

  inFlightLangs.add(lang);
  toast(t().toastTranslating);

  try {
    const entry = transCache[lang] || { chapters: {}, titles: {}, descs: {}, complete: false };

    // 1. Traduction des 5 titres de chapitres (depuis l'anglais d'origine)
    const chIds = Object.keys(CHAPTERS);
    const chTexts = chIds.map((c) => CHAPTERS[c]);
    const chUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(TRANSLATE_CODES[lang] || lang)}&dt=t&q=${encodeURIComponent(chTexts.join('\n'))}`;
    const chRes = await fetch(chUrl);
    if (chRes.ok) {
      const chData = await chRes.json();
      const chLines = (chData[0] || []).map((p) => p[0] || '').join('').split('\n');
      chIds.forEach((c, i) => {
        entry.chapters[c] = (chLines[i] && chLines[i].trim()) ? chLines[i].trim() : CHAPTERS[c];
      });
    }

    // 2. Traduction des titres et descriptions des 91 missions par lots de 15
    const BATCH_SIZE = 15;
    for (let i = 0; i < MISSIONS.length; i += BATCH_SIZE) {
      const slice = MISSIONS.slice(i, i + BATCH_SIZE);

      // Titres (source anglaise pour préserver les jeux de mots officiels)
      const titleUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(TRANSLATE_CODES[lang] || lang)}&dt=t&q=${encodeURIComponent(slice.map((m) => m.title).join('\n'))}`;
      const titleRes = await fetch(titleUrl);
      if (titleRes.ok) {
        const titleData = await titleRes.json();
        const titleLines = (titleData[0] || []).map((p) => p[0] || '').join('').split('\n');
        slice.forEach((m, idx) => {
          entry.titles[m.id] = (titleLines[idx] && titleLines[idx].trim()) ? titleLines[idx].trim() : m.title;
        });
      }

      // Descriptions (source française)
      const translatedDescs = await translateBatch(slice.map((m) => m.description), lang);
      slice.forEach((m, idx) => {
        entry.descs[m.id] = translatedDescs[idx];
      });

      transCache[lang] = entry;
      if (state.lang === lang) {
        buildChapterSelect();
        renderList();
        if (state.currentId) openMission(state.currentId, true);
      }
    }

    entry.complete = true;
    transCache[lang] = entry;
    store.set(K_TRANS_CACHE, JSON.stringify(transCache));
  } catch (err) {
    console.warn('Rate6 — translation fallback', err);
  } finally {
    inFlightLangs.delete(lang);
  }
}

function ratingWord(v) {
  const w = t().words;
  if (v <= 1) return w[0];
  if (v <= 2) return w[1];
  if (v <= 3) return w[2];
  if (v <= 4) return w[3];
  if (v < 5) return w[4];
  return w[5];
}

function starsHTML(value, extraClass, fontSize) {
  const pct = Math.max(0, Math.min(100, (value / 5) * 100));
  return `<span class="stars ${extraClass || ''}" style="font-size:${fontSize}" aria-hidden="true">` +
         `<span class="bg">★★★★★</span><span class="fg" style="width:${pct}%">★★★★★</span></span>`;
}

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

let stats = {};
let myVotes = {};
let lastKeys = {};
let firstRender = true;
let sb = null;

function adjust(id, oldRating, newRating) {
  const s = stats[id] || { count: 0, sum: 0 };
  if (oldRating != null) { s.sum -= oldRating; s.count -= 1; }
  if (newRating != null) { s.sum += newRating; s.count += 1; }
  if (s.count < 0) { s.count = 0; s.sum = 0; }
  stats[id] = s;
}

function isHidden(id) {
  return state.antiSpoiler && myVotes[id] == null && !state.revealed.has(id);
}
function saveRevealed() { store.set(K_REVEALED, JSON.stringify([...state.revealed])); }

  $('#spoilerLabel').textContent = L.spoilerBtn;
  $('#spoilerToggle').title = L.spoilerTitle;
  $('#search').placeholder = L.searchPlaceholder;
  $('#demoBanner').innerHTML = L.demoBanner;
  $('#heroTitle').innerHTML = L.heroTitle;
  $('#footerText').textContent = L.footer;
  setStatus(state.statusKind);
  buildChapterSelect();
  renderList();
  if (state.currentId) openMission(state.currentId, true);
  ensureContentTranslated(state.lang);
}

function buildChapterSelect() {
  const prev = state.chapter;
  const chapters = [...new Set(MISSIONS.map((m) => m.chapter))].sort((a, b) => a - b);
  $('#chapterFilter').innerHTML =
    `<option value="all">${esc(t().allChapters)}</option>` +
    chapters.map((c) => {
      const chTitle = getChapterTitle(c);
      const label = state.lang === 'zh'
        ? `第 ${c} 章 — ${chTitle}`
        : `${t().chapterWord} ${c} — ${chTitle}`;
      return `<option value="${c}">${esc(label)}</option>`;
    }).join('');
  $('#chapterFilter').value = prev;
}

/* ==========================================================================
   RENDU — LISTE
   ========================================================================== */
function filtered() {
  const q = norm(state.query.trim());
  return SORTED.filter((m) => {
    if (state.chapter !== 'all' && String(m.chapter) !== state.chapter) return false;
    if (!q) return true;
    const hay = norm([
      m.title, getMissionTitle(m),
      m.description, getMissionDesc(m),
      m.protagonist,
      CHAPTERS[m.chapter] || '', getChapterTitle(m.chapter),
      'chapitre ' + m.chapter, 'chapter ' + m.chapter
    ].join(' '));
    return hay.includes(q);
  });
}

function cardHTML(m, changed) {
  const L = t();
  const s = stats[m.id] || { count: 0, sum: 0 };
  const avg = s.count ? s.sum / s.count : 0;
  const mine = myVotes[m.id];
  const hidden = isHidden(m.id);

  return `
  <article class="card p-4 flex flex-col gap-3 ${changed ? 'flash' : ''}" data-id="${esc(m.id)}" tabindex="0" role="button">
    <div class="flex items-center justify-between gap-2">
      <span class="chip font-display">CH.${m.chapter} · ${L.noWord} ${pad2(m.order)}</span>
      <span class="tag tag-${tagKey(m.protagonist)}">${esc(m.protagonist)}</span>
    </div>

    <div class="${hidden ? 'spoiler' : ''}" ${hidden ? 'aria-hidden="true"' : ''}>
      <h3 class="font-display font-bold text-[1.08rem] leading-snug tracking-tight">${esc(getMissionTitle(m))}</h3>
      <p class="mt-1.5 text-sm text-muted line-clamp-2 leading-relaxed">${esc(getMissionDesc(m))}</p>
    </div>
    ${hidden ? `<div class="flex items-center gap-1.5 text-[11px] font-semibold text-neon-cyan"><i data-lucide="eye-off" class="w-3.5 h-3.5"></i> ${esc(L.spoilerCard)}</div>` : ''}

    <div class="mt-auto pt-3 border-t border-line flex items-end justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          ${starsHTML(avg, '', '1.05rem')}
          <span class="font-display font-bold text-base">${s.count ? fmt1(avg) : '—'}</span>
        </div>
        <div class="mt-1 flex items-center gap-1 text-xs text-muted">
          <i data-lucide="users" class="w-3 h-3"></i><span>${votesLabel(s.count)}</span>
        </div>
      </div>
      <div class="text-right">
        ${mine != null
          ? `<div class="text-[10px] uppercase tracking-widest text-muted">${esc(L.yourRating)}</div>
             <div class="font-display font-bold text-neon-pink text-base">★ ${fmt1(mine)}</div>`
          : `<div class="text-[11px] text-muted">${esc(L.notRated)}</div>`}
      </div>
    </div>
  </article>`;
}

function renderSummary() {
  const totalVotes = MISSIONS.reduce((n, m) => n + ((stats[m.id] && stats[m.id].count) || 0), 0);
  const mineCount = MISSIONS.filter((m) => myVotes[m.id] != null).length;
  $('#summary').textContent = t().summary(MISSIONS.length, votesLabel(totalVotes), mineCount);
}

function renderList() {
  const L = t();
  const changed = new Set();
  MISSIONS.forEach((m) => {
    const s = stats[m.id] || { count: 0, sum: 0 };
    const key = s.count + '|' + s.sum;
    if (!firstRender && lastKeys[m.id] !== undefined && lastKeys[m.id] !== key) changed.add(m.id);
    lastKeys[m.id] = key;
  });
  if (Object.keys(stats).length) firstRender = false;

  const list = filtered();
  const root = $('#list');

  if (!list.length) {
    root.innerHTML = `
      <div class="text-center py-20 border border-dashed border-line rounded-2xl">
        <div class="font-display font-bold text-xl mb-1">${esc(L.noResultsTitle)}</div>
        <p class="text-sm text-muted">${esc(L.noResultsSub)}</p>
      </div>`;
  } else {
    const chapters = [...new Set(list.map((m) => m.chapter))].sort((a, b) => a - b);
    root.innerHTML = chapters.map((ch) => {
      const chBadge = state.lang === 'zh' ? `第 ${ch} 章` : `${L.chapterUpper} ${ch}`;
      return `
      <section class="mb-10">
        <div class="flex items-baseline gap-3 mb-4">
          <span class="font-display font-bold text-xs tracking-[.22em] text-neon-pink">${esc(chBadge)}</span>
          <h2 class="font-display font-bold text-lg">${esc(getChapterTitle(ch))}</h2>
          <span class="rule"></span>
        </div>
        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
          ${list.filter((m) => m.chapter === ch).map((m) => cardHTML(m, changed.has(m.id))).join('')}
        </div>
      </section>`;
    }).join('');
  }
  renderSummary();
  refreshIcons();
}

/* ==========================================================================
   RENDU — MODALE
   ========================================================================== */
let raterShow = () => {};

function openMission(id, keepScroll = false) {
  const m = byId[id];
  if (!m) return;
  const L = t();
  state.currentId = id;
  state.lastFocusId = id;
  if (!state.revealed.has(id)) { state.revealed.add(id); saveRevealed(); }

  const s = stats[id] || { count: 0, sum: 0 };
  const avg = s.count ? s.sum / s.count : 0;
  const mine = myVotes[id];

  $('#modalBody').innerHTML = `
    <div class="flex items-start justify-between gap-4">
      <div class="min-w-0">
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <span class="chip font-display">CH.${m.chapter} · ${L.noWord} ${pad2(m.order)}</span>
        </div>
        <p class="text-[11px] uppercase tracking-[.2em] text-neon-cyan font-semibold">${esc(getChapterTitle(m.chapter) || L.chapterWord + ' ' + m.chapter)}</p>
        <h2 id="modalTitle" class="font-display font-extrabold text-2xl leading-tight mt-1">${esc(getMissionTitle(m))}</h2>
      </div>
      <button id="modalClose" type="button" aria-label="Close"
              class="shrink-0 w-9 h-9 grid place-items-center rounded-xl border border-line hover:border-neon-pink/60 transition">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="mt-4 flex items-center gap-2 text-sm">
      <span class="text-muted">${esc(L.playableChar)}</span>
      <span class="tag tag-${tagKey(m.protagonist)}">${esc(m.protagonist)}</span>
    </div>

    <p class="mt-4 text-[15px] leading-relaxed text-[#C9C9D6]">${esc(getMissionDesc(m))}</p>

    <div class="mt-6 grid grid-cols-2 gap-3">
      <div class="box">
        <div class="text-[10px] uppercase tracking-widest text-muted mb-1">${esc(L.community)}</div>
        <div class="flex items-baseline gap-2">
          <span id="mAvg" class="font-display font-extrabold text-3xl">${s.count ? fmt1(avg) : '—'}</span>
          <span class="text-xs text-muted">/ 5</span>
        </div>
        <div id="mAvgStars" class="mt-1">${starsHTML(avg, '', '1rem')}</div>
        <div id="mCount" class="mt-1 text-xs text-muted">${votesLabel(s.count)}</div>
      </div>
      <div class="box">
        <div class="text-[10px] uppercase tracking-widest text-muted mb-1">${esc(L.yourRating)}</div>
        <div class="flex items-baseline gap-2">
          <span id="mMine" class="font-display font-extrabold text-3xl text-neon-pink">${mine != null ? fmt1(mine) : '—'}</span>
          <span class="text-xs text-muted">/ 5</span>
        </div>
        <div id="mMineHint" class="mt-1 text-xs text-muted">${esc(mine != null ? L.clickToEdit : L.notRated)}</div>
      </div>
    </div>

    <div class="mt-6">
      <p class="text-sm font-semibold mb-3">${esc(mine != null ? L.editRating : L.giveRating)}</p>
      <div class="flex flex-col items-center gap-3 py-2">
        <div id="rater" class="rater" tabindex="0" role="slider"
             aria-valuemin="0.5" aria-valuemax="5" aria-valuenow="${mine != null ? mine : 0}">
          <span class="bg">★★★★★</span><span id="raterFg" class="fg" style="width:${mine != null ? (mine / 5) * 100 : 0}%">★★★★★</span>
        </div>
        <div id="raterLabel" class="text-sm text-muted h-5"></div>
        <p class="text-[11px] text-muted text-center">${esc(L.raterHint)}</p>
      </div>
    </div>
  `;

  $('#modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  refreshIcons();
  bindRater();
  if (!keepScroll) renderList();
  $('#modalClose').focus();
}

function bindRater() {
  const rater = $('#rater');
  const fg = $('#raterFg');
  const label = $('#raterLabel');
  let preview = null;

  const mine = () => myVotes[state.currentId] || 0;

  raterShow = (v) => {
    fg.style.width = (v / 5) * 100 + '%';
    label.textContent = v ? `${fmt1(v)} / 5 — ${ratingWord(v)}` : t().raterPrompt;
  };
  raterShow(mine());

  const valueFromEvent = (e) => {
    const rect = rater.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    return Math.min(5, Math.max(0.5, Math.ceil(ratio * 10) / 2));
  };

  const commit = async (v) => {
    rater.classList.remove('pop'); void rater.offsetWidth; rater.classList.add('pop');
    preview = null;
    await castVote(state.currentId, v);
    raterShow(mine());
    rater.setAttribute('aria-valuenow', String(mine()));
  };

  rater.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    preview = valueFromEvent(e);
    raterShow(preview);
  });
  rater.addEventListener('pointerleave', () => { preview = null; raterShow(mine()); });
  rater.addEventListener('click', (e) => commit(valueFromEvent(e)));

  rater.addEventListener('keydown', (e) => {
    const cur = preview != null ? preview : mine();
    let handled = true;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') preview = Math.min(5, (cur || 0) + 0.5);
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') preview = Math.max(0.5, (cur || 1) - 0.5);
    else if (e.key === 'Home') preview = 0.5;
    else if (e.key === 'End') preview = 5;
    else if (e.key === 'Enter' || e.key === ' ') { if (cur) commit(cur); }
    else handled = false;
    if (handled) {
      e.preventDefault();
      if (preview != null) raterShow(preview);
    }
  });
}

function refreshModal() {
  const id = state.currentId;
  if (!id || !$('#mAvg')) return;
  const L = t();
  const s = stats[id] || { count: 0, sum: 0 };
  const avg = s.count ? s.sum / s.count : 0;
  const mine = myVotes[id];
  $('#mAvg').textContent = s.count ? fmt1(avg) : '—';
  $('#mAvgStars').innerHTML = starsHTML(avg, '', '1rem');
  $('#mCount').textContent = votesLabel(s.count);
  $('#mMine').textContent = mine != null ? fmt1(mine) : '—';
  $('#mMineHint').textContent = mine != null ? L.clickToEdit : L.notRated;
}

function closeModal() {
  if (!state.currentId) return;
  const id = state.lastFocusId;
  state.currentId = null;
  raterShow = () => {};
  $('#modal').classList.remove('open');
  document.body.style.overflow = '';
  const card = id && document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (card) card.focus({ preventScroll: true });
}

/* ==========================================================================
   VOTE
   ========================================================================== */
async function castVote(id, rating) {
  const L = t();
  const prev = myVotes[id];
  if (prev === rating) { toast(L.toastUnchanged); return; }
  if (!DEMO_MODE && !sb) { toast(L.toastOffline); return; }

  adjust(id, prev != null ? prev : null, rating);
  myVotes[id] = rating;
  afterChange();

  if (DEMO_MODE) {
    store.set(K_DEMO_VOTES, JSON.stringify(myVotes));
    toast(prev != null ? L.toastUpdated : L.toastVoted);
    return;
  }

  try {
    const { error } = await sb.from('votes').upsert(
      { visitor_id: visitorId, mission_id: id, rating: rating },
      { onConflict: 'visitor_id,mission_id' }
    );
    if (error) throw error;
    toast(prev != null ? L.toastUpdated : L.toastVoted);
  } catch (err) {
    console.error('Rate6 — vote failed', err);
    adjust(id, rating, prev != null ? prev : null);
    if (prev != null) myVotes[id] = prev; else delete myVotes[id];
    afterChange();
    toast(L.toastError);
  }
}

function afterChange() { renderList(); refreshModal(); }

let renderQueued = false;
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  setTimeout(() => { renderQueued = false; afterChange(); }, 250);
}

/* ==========================================================================
   STATUT
   ========================================================================== */
function setStatus(kind) {
  state.statusKind = kind;
}

/* ==========================================================================
   MODE DÉMO
   ========================================================================== */
const BOT_RATINGS = [5, 5, 4.5, 4.5, 4, 4, 4, 3.5, 3.5, 3, 2.5, 2, 1.5];

function initDemo() {
  setStatus('demo');
  $('#demoBanner').classList.remove('hidden');

  MISSIONS.forEach((m) => {
    const h = hash(m.id);
    const count = 60 + (h % 380);
    const avg = 3.1 + ((h >>> 3) % 170) / 100;
    stats[m.id] = { count, sum: Math.round(avg * count * 2) / 2 };
  });

  myVotes = readJSON(K_DEMO_VOTES, {}) || {};
  Object.keys(myVotes).forEach((id) => { if (byId[id]) adjust(id, null, myVotes[id]); else delete myVotes[id]; });
  afterChange();

  window.addEventListener('storage', (e) => {
    if (e.key !== K_DEMO_VOTES) return;
    let next = {};
    try { next = JSON.parse(e.newValue) || {}; } catch (err) { next = {}; }
    MISSIONS.forEach((m) => {
      const o = myVotes[m.id], n = next[m.id];
      if (o !== n) adjust(m.id, o != null ? o : null, n != null ? n : null);
    });
    myVotes = next;
    queueRender();
  });

  const tick = () => {
    if (!document.hidden) {
      const m = MISSIONS[Math.floor(Math.random() * MISSIONS.length)];
      adjust(m.id, null, BOT_RATINGS[Math.floor(Math.random() * BOT_RATINGS.length)]);
      queueRender();
    }
    setTimeout(tick, 2500 + Math.random() * 3500);
  };
  setTimeout(tick, 3000);
}

/* ==========================================================================
   MODE LIVE (Supabase + Realtime)
   ========================================================================== */
async function loadStats() {
  const { data, error } = await sb.from('mission_stats').select('mission_id,votes_count,sum_rating');
  if (error) throw error;
  const next = {};
  (data || []).forEach((r) => { next[r.mission_id] = { count: Number(r.votes_count), sum: Number(r.sum_rating) }; });
  stats = next;
}

async function loadMyVotes() {
  const { data, error } = await sb.from('votes').select('mission_id,rating').eq('visitor_id', visitorId);
  if (error) throw error;
  const next = {};
  (data || []).forEach((r) => { next[r.mission_id] = Number(r.rating); });
  myVotes = next;
}

async function resync() {
  try {
    await Promise.all([loadStats(), loadMyVotes()]);
    afterChange();
  } catch (err) { console.warn('Rate6 — resync failed', err); }
}

let resyncTimer = null;
function scheduleResync() {
  clearTimeout(resyncTimer);
  resyncTimer = setTimeout(resync, 400);
}

function onVoteChange(payload) {
  const n = payload.new || {};
  const o = payload.old || {};
  const type = payload.eventType;

  if (type === 'INSERT' || type === 'UPDATE') {
    if (n.visitor_id === visitorId) {
      if (myVotes[n.mission_id] !== Number(n.rating)) scheduleResync();
      return;
    }
  }

  if (type === 'INSERT') {
    adjust(n.mission_id, null, Number(n.rating));
  } else if (type === 'UPDATE') {
    if (o.rating !== undefined && o.mission_id === n.mission_id) adjust(n.mission_id, Number(o.rating), Number(n.rating));
    else { scheduleResync(); return; }
  } else if (type === 'DELETE') {
    if (o.visitor_id === visitorId) { scheduleResync(); return; }
    if (o.rating !== undefined && o.mission_id) adjust(o.mission_id, Number(o.rating), null);
    else { scheduleResync(); return; }
  }
  queueRender();
}

async function initLive() {
  setStatus('connecting');
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    setStatus('offline');
    return;
  }
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: false, autoRefreshToken: false },
      realtime: { params: { eventsPerSecond: 10 } }
    });
    await Promise.all([loadStats(), loadMyVotes()]);
    afterChange();

    sb.channel('rate6-votes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'votes' }, onVoteChange)
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') { setStatus('live'); resync(); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') setStatus('offline');
        else if (status === 'CLOSED') setStatus('connecting');
      });

    setInterval(() => { if (!document.hidden) resync(); }, 60000);
  } catch (err) {
    console.error('Rate6 — Supabase error', err);
    setStatus('offline');
  }
}

/* ==========================================================================
   INTERACTIONS
   ========================================================================== */
function applySpoilerUI() {
  $('#spoilerToggle').setAttribute('aria-checked', String(state.antiSpoiler));
}

function bindEvents() {
  $('#search').addEventListener('input', (e) => { state.query = e.target.value; renderList(); });
  $('#chapterFilter').addEventListener('change', (e) => { state.chapter = e.target.value; renderList(); });

  $('#langSelect').addEventListener('change', (e) => {
    state.lang = e.target.value;
    store.set(K_LANG, state.lang);
    applyLanguageUI();
    toast(t().toastLang);
  });

  $('#spoilerToggle').addEventListener('click', () => {
    state.antiSpoiler = !state.antiSpoiler;
    store.set(K_SPOILER, state.antiSpoiler ? '1' : '0');
    if (state.antiSpoiler) { state.revealed.clear(); saveRevealed(); }
    applySpoilerUI();
    renderList();
    toast(state.antiSpoiler ? t().toastSpoilerOn : t().toastSpoilerOff);
  });

  const list = $('#list');
  list.addEventListener('click', (e) => {
    const card = e.target.closest('[data-id]');
    if (card) openMission(card.dataset.id);
  });
  list.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('[data-id]');
    if (card) { e.preventDefault(); openMission(card.dataset.id); }
  });

  $('#modal').addEventListener('click', (e) => {
    if (e.target === $('#modal') || e.target.closest('#modalClose')) closeModal();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.currentId) { closeModal(); return; }
    if (e.key === '/' && !state.currentId && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); $('#search').focus();
    }
    if (e.key === 'Tab' && state.currentId) {
      const f = [...$('#modalPanel').querySelectorAll('button, [tabindex="0"]')].filter((el) => !el.disabled);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
}

/* ==========================================================================
   DÉMARRAGE
   ========================================================================== */
function init() {
  applySpoilerUI();
  bindEvents();
  applyLanguageUI();
  if (DEMO_MODE) initDemo(); else initLive();
}

init();
</script>
